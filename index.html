<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중고랜드 - 수수료 0원 중고거래</title>
  <meta name="description" content="수수료 없는 중고거래 앱, 중고랜드" />
  <meta property="og:title" content="중고랜드 - 수수료 0원 중고거래" />
  <meta property="og:description" content="팔아도 내 돈, 수수료 0원 중고거래 앱" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      min-height: 100dvh;
    }

    body {
      background: #fff8f8;
      color: #1a1a1a;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 배경 블러 서클 */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-blob-1 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, #FF5A5F44 0%, transparent 70%);
      top: -120px; right: -120px;
      animation: drift1 9s ease-in-out infinite alternate;
    }
    .bg-blob-2 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, #ffaaac33 0%, transparent 70%);
      bottom: -80px; left: -80px;
      animation: drift2 11s ease-in-out infinite alternate;
    }
    .bg-blob-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #ffe0e133 0%, transparent 70%);
      top: 40%; left: 10%;
      animation: drift1 7s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(-24px, 28px); } }
    @keyframes drift2 { to { transform: translate(28px, -22px); } }

    /* 메인 카드 */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,90,95,0.12);
      border-radius: 36px;
      padding: 52px 44px 44px;
      max-width: 360px;
      width: calc(100% - 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      box-shadow: 0 8px 60px rgba(255,90,95,0.1), 0 2px 12px rgba(0,0,0,0.06);
    }

    /* 앱 아이콘 */
    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 12px 40px rgba(255,90,95,0.28), 0 4px 12px rgba(0,0,0,0.08);
      opacity: 0;
      animation: popIn 0.55s 0.1s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 앱명 */
    .app-name {
      font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #1a1a1a;
      line-height: 1;
      margin-bottom: 4px;
      opacity: 0;
      animation: fadeUp 0.45s 0.22s ease forwards;
    }
    .app-name span {
      color: #FF5A5F;
    }

    /* 뱃지 태그 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #FF5A5F;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 5px 13px;
      border-radius: 100px;
      margin-bottom: 28px;
      margin-top: 10px;
      opacity: 0;
      animation: fadeUp 0.45s 0.32s ease forwards;
    }
    .badge::before {
      content: '✦';
      font-size: 9px;
    }

    /* 서브 카피 */
    .copy {
      font-size: 13.5px;
      color: #888;
      font-weight: 400;
      margin-bottom: 32px;
      text-align: center;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 0.45s 0.4s ease forwards;
    }

    /* 스토어 버튼 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      opacity: 0;
      animation: fadeUp 0.45s 0.5s ease forwards;
    }

    .store-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1.5px solid #f0e0e0;
      border-radius: 16px;
      padding: 14px 20px;
      text-decoration: none;
      color: #1a1a1a;
      transition: all 0.18s ease;
      cursor: pointer;
    }
    .store-btn:hover {
      border-color: #FF5A5F;
      box-shadow: 0 4px 20px rgba(255,90,95,0.15);
      transform: translateY(-2px);
    }
    .store-btn:active { transform: scale(0.97); }

    .store-btn svg {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
    }

    .btn-text { text-align: left; }
    .btn-text small {
      display: block;
      font-size: 10px;
      color: #aaa;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
      font-weight: 400;
    }
    .btn-text strong {
      font-size: 14.5px;
      font-weight: 700;
      color: #1a1a1a;
    }

    /* 추천 버튼 강조 */
    .store-btn.highlight {
      background: linear-gradient(135deg, #FF5A5F, #FF7A7F);
      border-color: transparent;
    }
    .store-btn.highlight .btn-text small { color: rgba(255,255,255,0.75); }
    .store-btn.highlight .btn-text strong { color: #fff; }
    .store-btn.highlight svg { color: #fff; }
    .store-btn.highlight:hover {
      box-shadow: 0 8px 28px rgba(255,90,95,0.38);
    }

    /* 구분선 */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ddd;
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #f0e0e0;
    }

    /* 연도 */
    .footer {
      margin-top: 28px;
      font-size: 11px;
      color: #ccc;
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeUp 0.45s 0.65s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
